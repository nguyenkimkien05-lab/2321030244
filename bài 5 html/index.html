<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Style</title>
        <style>
            h2{color: black;
            background-color: antiquewhite;
        }
        </style>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 style="color: black; background-color: aqua;">Web</h1>
        <!-- Nếu là id sử dụng dấu # tên id -->
        <h2 id="tieude-1">Web</h2>
        <!-- Nếu là class sử dụng . + tên id -->
        <h3 class="tieude-2">Web</h3>
        <div class="Web4">Web4</div>
        </div>
        <div class="khoi-1">Khối 1</div>
        <div class="khoi-2">Khối 2</div>
        <div class="khoi-3">Khối 3</div>
            <style>
                .khoi-1{
                    background-color: red;
                }
                .khoi-2{
                    background-color: green;
                /* margin truyền 1 giá trị thì sẽ cách xung quanh bằng giá trị đó */
                /* hai giá trị thì giá trị đầu là trên dưới, giá trị 2 là phải trái */
                margin: 10px 50px 100px 200px;}
                .khoi-3{
                    background-color: blue;
                    padding: 10px 50px 100px 200px;
                }
            </style>
    </body>
</html>
