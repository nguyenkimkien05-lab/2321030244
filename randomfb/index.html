<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #263b65 0%, #0b1020 45%, #05070d 100%);
    color: white;
    min-height: 100vh;
}

/* ================= HEADER ================= */

.header {
    width: 100%;
    background: rgba(5, 8, 18, 0.95);
    border-bottom: 1px solid #39476b;
    padding: 15px 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #ffd75a;
}

.logo span {
    color: white;
}

.menu {
    display: flex;
    gap: 25px;
}

.menu a {
    color: #dce3f5;
    text-decoration: none;
    font-weight: bold;
}

.menu a:hover {
    color: #ffd75a;
}

/* ================= MAIN ================= */

.container {
    width: 95%;
    max-width: 1400px;
    margin: 30px auto;
}

.title {
    text-align: center;
    margin-bottom: 10px;
}

.title h1 {
    margin: 0;
    font-size: 42px;
    color: #ffd75a;
    text-shadow: 0 0 20px rgba(255,215,90,.35);
}

.title p {
    color: #aeb9d2;
}

/* ================= CONTROL ================= */

.controls {
    background: rgba(18, 25, 46, .95);
    border: 1px solid #39476b;
    border-radius: 15px;
    padding: 20px;

    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: center;
}

.controls label {
    font-weight: bold;
}

.controls input,
.controls select {
    padding: 11px 15px;
    border-radius: 8px;
    border: 1px solid #59698f;
    background: #0d1428;
    color: white;
}

.open-btn {
    border: none;
    padding: 13px 35px;

    border-radius: 10px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    background: linear-gradient(135deg, #ffd75a, #ff9d00);
    color: #111;

    box-shadow: 0 0 20px rgba(255, 180, 0, .3);

    transition: .2s;
}

.open-btn:hover {
    transform: scale(1.05);
}

.open-btn:active {
    transform: scale(.97);
}

/* ================= CHEST ================= */

.chest-area {
    text-align: center;
    margin: 35px 0;
}

.chest {
    width: 220px;
    height: 160px;

    margin: auto;

    background: linear-gradient(145deg, #a75b16, #532607);

    border: 7px solid #d99a38;
    border-radius: 15px;

    box-shadow:
        0 20px 40px rgba(0,0,0,.6),
        inset 0 0 30px rgba(0,0,0,.4);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition: .3s;
}

.chest:hover {
    transform: translateY(-8px);
}

.chest span {
    font-size: 65px;
}

.chest.opening {
    animation: chestShake .7s infinite;
}

@keyframes chestShake {
    0% { transform: rotate(0); }
    25% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
    75% { transform: rotate(-5deg); }
    100% { transform: rotate(0); }
}

/* ================= RESULT ================= */

.result {
    display: none;

    max-width: 450px;

    margin: 30px auto;

    background:
        linear-gradient(
            145deg,
            rgba(45, 56, 95, .98),
            rgba(12, 17, 33, .98)
        );

    border: 2px solid #ffd75a;

    border-radius: 20px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 0 40px rgba(255,215,90,.25);

    animation: appear .5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.player-image {
    width: 220px;
    height: 270px;

    object-fit: cover;

    border-radius: 15px;

    border: 3px solid #ffd75a;

    background: #10182c;

    margin-bottom: 15px;
}

.player-name {
    font-size: 30px;
    font-weight: bold;

    color: #ffd75a;

    margin: 5px 0;
}

.player-info {
    color: #cbd4e9;

    margin: 8px 0;
}

.rating {
    font-size: 48px;
    font-weight: bold;

    color: #ffd75a;

    text-shadow: 0 0 15px rgba(255,215,90,.5);
}

.rarity {
    display: inline-block;

    padding: 7px 16px;

    border-radius: 20px;

    margin-top: 8px;

    font-weight: bold;

    background: #6d4aff;
}

/* ================= LIST ================= */

.section-title {
    margin-top: 50px;

    font-size: 25px;

    color: #ffd75a;
}

.player-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(170px, 1fr));

    gap: 15px;
}

.player-card {
    background: rgba(17, 24, 45, .95);

    border: 1px solid #39476b;

    border-radius: 12px;

    padding: 10px;

    text-align: center;

    transition: .2s;
}

.player-card:hover {
    transform: translateY(-5px);

    border-color: #ffd75a;

    box-shadow: 0 8px 25px rgba(0,0,0,.4);
}

.card-image {
    width: 100%;
    height: 170px;

    object-fit: cover;

    border-radius: 8px;

    background: #0c1222;
}

.card-name {
    font-weight: bold;

    margin-top: 8px;
}

.card-info {
    color: #9faac2;

    font-size: 13px;

    margin-top: 5px;
}

/* ================= FOOTER ================= */

footer {
    text-align: center;

    color: #75819c;

    padding: 40px 20px;
}

/* ================= MOBILE ================= */

@media(max-width: 700px) {

    .header {
        padding: 15px;
    }

    .menu {
        display: none;
    }

    .title h1 {
        font-size: 30px;
    }

    .chest {
        width: 180px;
        height: 130px;
    }

    .player-image {
        width: 180px;
        height: 230px;
    }
}
</style>

/* =====================================================
   LẤY ẢNH TỪ WIKIMEDIA COMMONS
===================================================== */

async function getPlayerImage(playerName) {

    try {

        const url =
        "https://commons.wikimedia.org/w/api.php" +
        "?action=query" +
        "&generator=search" +
        "&gsrsearch=" +
        encodeURIComponent(playerName + " football") +
        "&gsrnamespace=6" +
        "&gsrlimit=1" +
        "&prop=imageinfo" +
        "&iiprop=url" +
        "&iiurlwidth=500" +
        "&format=json" +
        "&origin=*";

        const response = await fetch(url);

        const data = await response.json();

        if (
            data.query &&
            data.query.pages
        ) {

            const pages =
                Object.values(data.query.pages);

            if (
                pages[0] &&
                pages[0].imageinfo
            ) {

                return pages[0]
                    .imageinfo[0]
                    .thumburl ||
                    pages[0]
                    .imageinfo[0]
                    .url;

            }

        }

    } catch(error) {

        console.log(
            "Không tải được ảnh:",
            playerName
        );

    }

    return "";
}


/* =====================================================
   TẠO DANH SÁCH
===================================================== */

async function renderPlayers() {

    const grid =
        document.getElementById("playerGrid");

    grid.innerHTML = "";

    for (
        const player of players
    ) {

        const card =
            document.createElement("div");

        card.className =
            "player-card";

        card.innerHTML = `

            <img
                class="card-image"
                id="img-${player.name.replace(/\W/g,'')}"
                src=""
                alt="${player.name}"
            >

            <div class="card-name">
                ${player.name}
            </div>

            <div class="card-info">
                ${player.country}
            </div>

            <div class="card-info">
                ${player.position}
                •
                ⭐ ${player.rating}
            </div>

        `;

        grid.appendChild(card);


        const image =
            await getPlayerImage(
                player.name
            );

        const img =
            card.querySelector(
                ".card-image"
            );

        if(image) {

            img.src = image;

        } else {

            img.src =
                "https://via.placeholder.com/500x600/10182c/ffd75a?text=" +
                encodeURIComponent(
                    player.name
                );

        }

    }

}


/* =====================================================
   RANDOM CẦU THỦ
===================================================== */

async function openChest() {

    const chest =
        document.getElementById("chest");

    const result =
        document.getElementById("result");

    const position =
        document.getElementById("position")
        .value;

    const budget =
        Number(
            document.getElementById("budget")
            .value
        );


    let available =
        players.filter(
            player => {

                const positionOK =
                    position === "ALL" ||
                    player.position === position;

                const budgetOK =
                    player.value <= budget;

                return positionOK &&
                       budgetOK;

            }
        );


    /*
       Nếu ngân sách quá thấp,
       bỏ điều kiện ngân sách
       để vẫn random được.
    */

    if(available.length === 0) {

        available =
            players.filter(
                player =>
                    position === "ALL" ||
                    player.position === position
            );

    }


    if(available.length === 0) {

        alert(
            "Không có cầu thủ phù hợp!"
        );

        return;

    }


    chest.classList.add(
        "opening"
    );

    result.style.display =
        "none";


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1200
            )
    );


    const player =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    const image =
        await getPlayerImage(
            player.name
        );


    document.getElementById(
        "resultImage"
    ).src =
        image ||
        "https://via.placeholder.com/500x600/10182c/ffd75a?text=" +
        encodeURIComponent(
            player.name
        );


    document.getElementById(
        "resultRating"
    ).textContent =
        player.rating;


    document.getElementById(
        "resultName"
    ).textContent =
        player.name;


    document.getElementById(
        "resultPosition"
    ).textContent =
        "⚽ Vị trí: " +
        player.position;


    document.getElementById(
        "resultCountry"
    ).textContent =
        player.country;


    document.getElementById(
        "resultClub"
    ).textContent =
        "🏟️ " +
        player.club;


    document.getElementById(
        "resultRarity"
    ).textContent =
        player.rarity;


    chest.classList.remove(
        "opening"
    );


    result.style.display =
        "block";


    result.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

renderPlayers();

</script>
